[project]
name = "fgo-mcp"
version = "0.1.0"
description = "MCP server that lets LLM agents play Fate/Grand Order on android over adb"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Prateek Kumar", email = "prateekkum990@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "av>=19.0.2",
    "fastapi>=0.165.0",
    "mcp[cli]>=2.3.0",
    "onnxruntime>=1.32.0",
    "opencv-python>=5.0.0.93",
    "rapidocr>=3.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
fgo-mcp = "fgo_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
constraint-dependencies = ["opencv-python-headless<5.1"]
